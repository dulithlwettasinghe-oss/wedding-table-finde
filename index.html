<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ushani &amp; Dulith – Find Your Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#efe3fb; --bg2:#d9c6f2; --card:#ffffffe0; --ink:#4a3560; --soft:#8a73a3;
  --pink:#f4b6d2; --pink2:#e98fb9; --lilac:#c9b1ec; --purple:#9b7bd1; --line:#e6d8f3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overscroll-behavior:none}
body{background:var(--bg2);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding:clamp(16px,3.5dvh,32px) max(18px,env(safe-area-inset-left,0px)) 32px max(18px,env(safe-area-inset-right,0px));position:relative;z-index:1;text-align:center;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.bg{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;overflow:hidden;z-index:0;pointer-events:none;background:linear-gradient(170deg,var(--bg1),var(--bg2));transform:translateZ(0)}
.bloom{position:absolute;width:190px;height:190px;z-index:0;pointer-events:none;opacity:.95}
.bloom.tl{top:-50px;left:-55px}.bloom.br{bottom:-55px;bottom:calc(-55px + (100lvh - 100svh));right:-60px;transform:rotate(140deg)}
.fly{position:absolute;z-index:2;pointer-events:none;width:46px;height:46px}
.fly svg{width:100%;height:100%;animation:flap .45s ease-in-out infinite alternate}
.f1{top:12%;left:-60px;animation:cross1 22s linear infinite}
.f2{top:62%;right:-60px;width:34px;height:34px;animation:cross2 28s linear infinite 4s}
.f3{top:36%;left:-60px;width:28px;height:28px;animation:cross1 34s linear infinite 12s}
@keyframes cross1{0%{transform:translate(0,0) rotate(15deg)}25%{transform:translate(30vw,-40px) rotate(-10deg)}50%{transform:translate(65vw,30px) rotate(20deg)}75%{transform:translate(95vw,-30px) rotate(-5deg)}100%{transform:translate(125vw,10px) rotate(10deg)}}
@keyframes cross2{0%{transform:translate(0,0) scaleX(-1)}30%{transform:translate(-35vw,50px) scaleX(-1)}60%{transform:translate(-75vw,-30px) scaleX(-1)}100%{transform:translate(-130vw,30px) scaleX(-1)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.45)}}
@media (prefers-reduced-motion:reduce){.fly{display:none}}
.lead{color:var(--soft);font-size:20px;margin:0}
h1{font-family:'Pinyon Script','Snell Roundhand',cursive;font-weight:400;font-size:clamp(46px,15vw,64px);line-height:1.05;margin:6px 0 4px;color:var(--purple)}
h1 span{display:block;font-size:34px;color:var(--pink2);line-height:1}
.when{margin:10px 0 0;font-size:19px}
.date{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.date .d{font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:96px;line-height:.9;color:var(--pink2);text-shadow:0 4px 18px #e98fb94d}
.date .m{text-align:left;font-size:26px;font-weight:600;line-height:1.15;border-left:2px solid var(--lilac);padding-left:14px}
.date .m small{display:block;font-size:20px;font-weight:400;color:var(--soft)}
.divider{margin:20px auto 18px;width:150px;height:18px}
h2{font-size:25px;font-weight:600;margin:0 0 12px}
.search{position:relative}
input{width:100%;font:inherit;font-size:max(16px,21px);-webkit-appearance:none;appearance:none;padding:16px 20px;border-radius:30px;border:2px solid var(--lilac);background:var(--card);color:var(--ink);outline:none;text-align:center;box-shadow:0 8px 24px #9b7bd126}
input::placeholder{color:var(--soft)}
input:focus-visible{border-color:var(--pink2);box-shadow:0 0 0 4px #f4b6d255}
.hint{color:var(--soft);font-size:17px;margin:10px 0 0}
#results{margin-top:18px;display:grid;gap:12px}
.guest{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 18px;cursor:pointer}
.guest:focus-visible{outline:3px solid var(--pink2)}
.guest .n{font-size:22px;font-weight:600}
.guest .t{font-size:16px;color:var(--soft)}
.badge{min-width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--pink),var(--lilac));color:#fff;font-size:26px;font-weight:600}
.big{background:var(--card);border:1px solid var(--line);border-radius:34px;padding:26px 20px 28px;box-shadow:0 14px 40px #9b7bd133;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.big .who{font-size:24px;margin:8px 0 0}
.big .lab{color:var(--soft);margin:0}
.big .num{font-family:'Pinyon Script',cursive;font-size:clamp(100px,32vw,140px);line-height:1;color:var(--pink2);margin:0}
.big .fl{font-size:22px;color:var(--purple);margin:0 0 10px}
.big .seat{font-size:18px;color:var(--soft)}
.link{background:none;border:0;font:inherit;color:var(--purple);text-decoration:underline;margin-top:14px;font-size:18px;cursor:pointer;padding:8px}
.empty{background:var(--card);border:1px dashed var(--lilac);border-radius:22px;padding:18px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.chip{font:inherit;font-size:20px;font-weight:600;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--lilac);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:linear-gradient(140deg,var(--pink),var(--purple));color:#fff;border-color:transparent}
.chip:focus-visible{outline:3px solid var(--pink2)}
#tableList{margin-top:16px;text-align:left}
#tableList h3{font-size:22px;text-align:center;margin:0 0 8px;color:var(--purple)}
#tableList li{padding:8px 4px;border-bottom:1px solid var(--line);list-style:none;font-size:20px}
#tableList ul{padding:0;margin:0}
.foot{margin-top:auto;padding-top:28px;color:var(--soft);font-size:18px}
.rain{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.heart{position:absolute;top:-40px;line-height:1;opacity:0;text-shadow:0 0 8px #ff9ccb88;animation:fall linear forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(-12deg);opacity:0}10%{opacity:.85}50%{transform:translate(18px,55vh) rotate(14deg)}90%{opacity:.8}100%{transform:translate(-14px,110vh) rotate(-10deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.rain{display:none}}
@media (max-height:680px){.divider{margin:10px auto}.lead{font-size:17px}h2{font-size:22px;margin-bottom:8px}.foot{padding-top:14px}.big{padding:16px 16px 18px}}
@media (max-width:360px){body{font-size:17px}.guest .n{font-size:20px}.badge{min-width:48px;height:48px;font-size:23px}}
.guest{min-height:64px;touch-action:manipulation}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flower" viewBox="-50 -50 100 100">
      <g fill="#f4b6d2"><ellipse cx="0" cy="-26" rx="13" ry="24"/><ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(60)"/><ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(120)"/><ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(180)"/><ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(240)"/><ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(300)"/></g>
      <g fill="#fff" opacity=".45"><ellipse cx="0" cy="-27" rx="5" ry="16"/><ellipse cx="0" cy="-27" rx="5" ry="16" transform="rotate(120)"/><ellipse cx="0" cy="-27" rx="5" ry="16" transform="rotate(240)"/></g>
      <circle r="9" fill="#fbe7a8"/><circle r="4" fill="#f0c96a"/>
    </symbol>
    <symbol id="flowerP" viewBox="-50 -50 100 100">
      <g fill="#c9b1ec"><ellipse cx="0" cy="-27" rx="11" ry="21"/><ellipse cx="0" cy="-27" rx="11" ry="21" transform="rotate(72)"/><ellipse cx="0" cy="-27" rx="11" ry="21" transform="rotate(144)"/><ellipse cx="0" cy="-27" rx="11" ry="21" transform="rotate(216)"/><ellipse cx="0" cy="-27" rx="11" ry="21" transform="rotate(288)"/></g>
      <circle r="8" fill="#fff"/><circle r="3.5" fill="#f4b6d2"/>
    </symbol>
    <symbol id="leaf" viewBox="0 0 40 80"><path d="M20 78C2 56 2 22 20 2c18 20 18 54 0 76z" fill="#cfe6d2" opacity=".85"/></symbol>
    <symbol id="bfly" viewBox="0 0 100 80">
      <path d="M50 38C38 6 6 4 8 28c1 14 22 18 42 10z" fill="#e98fb9"/>
      <path d="M50 42C36 46 14 52 20 68c8 12 26 2 30-26z" fill="#c9b1ec"/>
      <path d="M50 38C62 6 94 4 92 28c-1 14-22 18-42 10z" fill="#e98fb9"/>
      <path d="M50 42C64 46 86 52 80 68c-8 12-26 2-30-26z" fill="#c9b1ec"/>
      <circle cx="26" cy="26" r="6" fill="#fff" opacity=".6"/><circle cx="74" cy="26" r="6" fill="#fff" opacity=".6"/>
      <rect x="47.5" y="26" width="5" height="34" rx="2.5" fill="#6d4f93"/>
      <path d="M49 27c-4-10-8-14-12-15M51 27c4-10 8-14 12-15" stroke="#6d4f93" stroke-width="1.6" fill="none"/>
    </symbol>
  </defs>
</svg>

<div class="bg" aria-hidden="true">
<svg class="bloom tl" viewBox="0 0 190 190" aria-hidden="true">
  <use href="#leaf" x="70" y="85" width="26" height="52" transform="rotate(-40 83 111)"/>
  <use href="#leaf" x="105" y="70" width="24" height="48" transform="rotate(30 117 94)"/>
  <use href="#flower" x="30" y="30" width="110" height="110"/>
  <use href="#flowerP" x="108" y="94" width="62" height="62"/>
  <use href="#flowerP" x="12" y="118" width="48" height="48"/>
</svg>
<svg class="bloom br" viewBox="0 0 190 190" aria-hidden="true">
  <use href="#leaf" x="70" y="85" width="26" height="52" transform="rotate(-40 83 111)"/>
  <use href="#flower" x="30" y="30" width="110" height="110"/>
  <use href="#flowerP" x="108" y="94" width="62" height="62"/>
</svg>

<div class="fly f1" aria-hidden="true"><svg viewBox="0 0 100 80"><use href="#bfly"/></svg></div>
<div class="fly f2" aria-hidden="true"><svg viewBox="0 0 100 80"><use href="#bfly"/></svg></div>
<div class="fly f3" aria-hidden="true"><svg viewBox="0 0 100 80"><use href="#bfly"/></svg></div>

</div>
<div class="rain" id="rain" aria-hidden="true"></div>
<main class="wrap">
  <p class="lead">Welcome to the wedding of</p>
  <h1>Ushani <span>and</span> Dulith</h1>
  <p class="when">Hilton Colombo · Grand Ballroom</p>
  <svg class="divider" viewBox="0 0 150 18" aria-hidden="true"><path d="M5 9h50M95 9h50" stroke="#c9b1ec" stroke-width="1.5"/><use href="#flower" x="63" y="1" width="24" height="16"/></svg>

  <h2>Find your table</h2>
  <div class="search">
    <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Type your name" aria-label="Type your name to find your table">
  </div>
  <p class="hint" id="hint">Enter your first or last name</p>
  <div id="results" aria-live="polite"></div>


  <p class="foot">With love, Ushani &amp; Dulith</p>
</main>

<script>
/* ===== EDIT YOUR GUEST LIST HERE: ["Guest name", table number] ===== */
const GUESTS = [
  ["Nimali Perera",1],["Kasun Perera",1],["Sanduni Perera",1],["Ruwan Silva",1],
  ["Dilini Fernando",2],["Chamara Fernando",2],["Tharindu Jayasinghe",2],["Amaya Jayasinghe",2],
  ["Malsha Wickramasinghe",3],["Nuwan Wickramasinghe",3],["Hasini De Silva",3],["Pasan De Silva",3],
  ["Kavindi Rajapaksa",4],["Lakmal Rajapaksa",4],["Sachini Gunawardena",4],["Isuru Gunawardena",4],
  ["Thilini Bandara",5],["Chathura Bandara",5],["Ishara Senanayake",5],["Dinesh Senanayake",5],
  ["Anjali Mendis",6],["Roshan Mendis",6],["Piumi Abeysekera",6],["Janith Abeysekera",6],
  ["Sewwandi Ranasinghe",7],["Heshan Ranasinghe",7],["Oshadi Karunaratne",7],["Buddhika Karunaratne",7],
  ["Menaka Dissanayake",8],["Sajith Dissanayake",8],["Yasodha Weerasinghe",8],["Kaveen Weerasinghe",8]
];
const FLOWERS = ["Rose","Lotus","Jasmine","Orchid","Peony","Lily","Tulip","Magnolia","Daisy","Lavender","Iris","Blossom"];
const tableName = n => FLOWERS[(n-1) % FLOWERS.length];
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

const q=$("q"), results=$("results"), hint=$("hint");

function mates(n,name){return GUESTS.filter(g=>g[1]===n&&g[0]!==name).map(g=>g[0].split(" ")[0]);}

function showBig(g){
  const m=mates(g[1],g[0]);
  results.innerHTML=`<div class="big">
    <svg width="64" height="64" aria-hidden="true"><use href="#flower"/></svg>
    <p class="who">${g[0]}</p>
    <p class="lab">your table is</p>
    <p class="num">${g[1]}</p>
    <p class="fl">${tableName(g[1])} Table</p>
    <p class="seat">${m.length?"Sharing with "+m.join(", "):""}</p>
    <button class="link" id="back">Search again</button></div>`;
  hint.textContent="";burst();q.blur();results.scrollIntoView({behavior:"smooth",block:"center"});
  $("back").onclick=()=>{q.value="";render();q.focus();};
}

function render(){
  const v=norm(q.value);
  if(!v){results.innerHTML="";hint.textContent="Enter your first or last name";return;}
  const found=GUESTS.filter(g=>norm(g[0]).includes(v)).slice(0,8);
  if(found.length===1){showBig(found[0]);return;}
  if(!found.length){
    results.innerHTML=`<div class="empty">We could not find that name. Check the spelling or try just your first or last name. Our team at the entrance will gladly help.</div>`;
    hint.textContent="";return;
  }
  hint.textContent="Tap your name";
  results.innerHTML="";
  found.forEach(g=>{
    const b=document.createElement("button");b.className="guest";
    b.innerHTML=`<span><span class="n">${g[0]}</span><br><span class="t">${tableName(g[1])} Table</span></span><span class="badge">${g[1]}</span>`;
    b.onclick=()=>showBig(g);results.appendChild(b);
  });
}
q.addEventListener("input",render);
q.addEventListener("keydown",e=>{if(e.key==="Enter")q.blur();});


/* heart rain */
const rain=document.getElementById("rain"), HC=["#ff9ccb","#ffb3d9","#ffc2e0","#c9a8f5","#b794f0","#a37fe8","#d4bcf8","#9b7bd1"];
function heart(){
  const h=document.createElement("span");h.className="heart";h.textContent="\u2665";
  h.style.left=Math.random()*100+"%";h.style.fontSize=(14+Math.random()*14)+"px";
  h.style.color=HC[Math.floor(Math.random()*HC.length)];
  const d=16+Math.random()*10;h.style.animationDuration=d+"s";
  rain.appendChild(h);setTimeout(()=>h.remove(),d*1000+200);
}
for(let i=0;i<5;i++)setTimeout(heart,i*1200);
setInterval(()=>{if(!document.hidden)heart();},2200);
function burst(){for(let i=0;i<6;i++)setTimeout(heart,i*350);}
</script>
</body>
</html>
